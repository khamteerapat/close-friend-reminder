server {
    listen 80;
    server_name summii-reminder.com www.summii-reminder.com;

    # บังคับให้เปลี่ยนจาก HTTP เป็น HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name summii-reminder.com www.summii-reminder.com;

    # --- ส่วนการตั้งค่า SSL ---
    # ตรวจสอบว่า Path ตรงกับชื่อโดเมนที่คุณขอใบเซอร์
    ssl_certificate /etc/letsencrypt/live/summii-reminder.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/summii-reminder.com/privkey.pem;

    # แนะนำการตั้งค่าความปลอดภัยตามมาตรฐาน
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    # --- การส่งต่อข้อมูลไปที่ Spring Boot ---
    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ปรับค่า Timeout
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}